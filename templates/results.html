<!DOCTYPE html>
<html>

<head>
    <title>Survey Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>Survey Responses</h2>
        {% for r in responses %}
        <div class="results-item">
            <b>Name:</b> {{ r.name }} <br>
            <!-- <b>Email:</b> {{ r.email }} <br> -->
            <b>Q1:</b> {{ r.q1 }} <br>
            <b>Q2:</b> {{ r.q2 }} <br>
            <b>Q3:</b> {{ r.q3 }} <br>
            <b>Q4:</b> {{ r.q4 }} <br>
            <b>Q5:</b> {{ r.q5 }} <br>
        </div>
        {% endfor %}
    </div>
</body>

</html>
